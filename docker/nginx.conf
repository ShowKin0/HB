# 静态站点配置。
#
# 缓存策略是本文件的核心，三档泾渭分明：
#   /_bundle/  构建产物，文件名带内容哈希 → 永久缓存
#   /assets/   你自己放的素材，文件名没有哈希 → 每次校验（走 ETag 304，几乎不耗流量）
#   /          入口 HTML → 绝不缓存，否则发新版本后玩家还在跑旧的
#
# 注意：nginx:alpine 默认不带 brotli 模块，这里只用 gzip。
# 想要 brotli 需要自己编译带 ngx_brotli 的镜像，收益大约再省 15%。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # ── 构建产物：内容哈希，永久缓存 ─────────────────────────
    location /_bundle/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── 内容素材：必须校验，否则改了图玩家还看到旧的 ──────────
    location /assets/ {
        add_header Cache-Control "no-cache";
        access_log off;
        try_files $uri =404;
    }

    # ── 入口与路由回退 ───────────────────────────────────────
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # 剧本与场景 JSON 别被浏览器缓存，调试时省心
    location ~* \.(json)$ {
        add_header Cache-Control "no-cache";
    }

    # 基础安全头。没有外部资源，CSP 可以收得很紧。
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 隐藏 nginx 版本号
    server_tokens off;
}
